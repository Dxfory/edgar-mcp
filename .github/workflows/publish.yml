# Publish edgar-filings-mcp to PyPI, then io.github.Dxfory/edgar-mcp
# to the official MCP registry, then a GitHub Release for vX.Y.Z tags.
#
# PyPI auth (one of these; no long-lived token in git or chat):
#   1. Preferred — trusted publisher:
#        https://pypi.org/manage/project/edgar-filings-mcp/settings/publishing/
#        Owner: Dxfory  Repository: edgar-mcp
#        Workflow: publish.yml  Environment: (leave blank)
#   2. Fallback — repo secret PYPI_API_TOKEN (PyPI "Trusted Publishing" is better).
#
# Registry auth is GitHub OIDC (io.github.Dxfory/*). No Smithery. No fifth tool.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/run_offline.py
      - run: python -m pip install -q build
      - run: python -m build
      - run: python scripts/check_wheel.py
      - name: Validate server.json
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

  pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      skipped: ${{ steps.present.outputs.skipped }}
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip upload if this version is already on PyPI
        id: present
        run: |
          ver=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read(), re.M).group(1))")
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/edgar-filings-mcp/${ver}/json")
          if [ "$code" = "200" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "edgar-filings-mcp ${ver} already on PyPI; skip upload"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.skipped != 'true'
        with:
          python-version: "3.11"
      - run: python -m pip install -q build
        if: steps.present.outputs.skipped != 'true'
      - run: python -m build
        if: steps.present.outputs.skipped != 'true'
      - name: Publish to PyPI with API token
        if: steps.present.outputs.skipped != 'true' && env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI with OIDC
        if: steps.present.outputs.skipped != 'true' && env.HAS_PYPI_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  registry:
    needs: [check, pypi]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          n=0
          until ./mcp-publisher publish; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "MCP registry publish failed after $n attempts"
              exit 1
            fi
            echo "registry publish attempt $n failed (PyPI may still be propagating); retrying in 15s"
            sleep 15
          done

  github_release:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip non-semver tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          ver=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read(), re.M).group(1))")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "edgar-filings-mcp ${ver}" --notes-file - <<'EOF'
          Four tools: `get_trading_symbols`, `get_segment_revenue`, `get_bdc_nonaccrual`, `get_form4`. No fifth tool.

          Install with `uvx`:

          ```json
          {
            "mcpServers": {
              "edgar-filings": {
                "command": "uvx",
                "args": ["edgar-filings-mcp"],
                "env": {
                  "EDGAR_IDENTITY": "Your Name you@example.com"
                }
              }
            }
          }
          ```

          PyPI: https://pypi.org/project/edgar-filings-mcp/
          MCP registry: `io.github.Dxfory/edgar-mcp`
          EOF
