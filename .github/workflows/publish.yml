# Publish edgar-filings-mcp 1.1.0 to PyPI, then io.github.Dxfory/edgar-mcp
# to the official MCP registry.
#
# One-time PyPI setup (required; this repo has no publish token):
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. Add a pending trusted publisher:
#        PyPI project name: edgar-filings-mcp
#        Owner: Dxfory
#        Repository: edgar-mcp
#        Workflow filename: publish.yml
#        Environment: (leave blank)
#   3. Merge this workflow to main, then either:
#        git tag v1.1.0 && git push origin v1.1.0
#      or Actions → publish → Run workflow
#
# Registry auth is GitHub OIDC (io.github.Dxfory/*). No Smithery. No fifth tool.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/run_offline.py
      - run: python -m pip install -q build
      - run: python -m build
      - run: python scripts/check_wheel.py
      - name: Validate server.json
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

  pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          n=0
          until ./mcp-publisher publish; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "MCP registry publish failed after $n attempts"
              exit 1
            fi
            echo "registry publish attempt $n failed (PyPI may still be propagating); retrying in 15s"
            sleep 15
          done
