[project]
name = "edgar-filings-mcp"
version = "1.0.0"
description = "MCP server for SEC 10-K/10-Q trading symbols, segment revenue, and Form 4 insider filings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zheng Xing", email = "dxfory@icloud.com" }]
keywords = ["mcp", "sec", "edgar", "10-k", "form-4", "xbrl"]
dependencies = [
    "edgartools>=4.0",
    "mcp>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/Dxfory/edgar-mcp"
Issues = "https://github.com/Dxfory/edgar-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
edgar-filings-mcp = "edgar_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgar_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
